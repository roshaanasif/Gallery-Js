<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-900">
  <nav class="w-full bg-white  shadow-md p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Gallery</h1>
    <div class="flex items-center justify-center gap-4">
      <div id="total">
          <select id="Category-dropdown"
              class="px-4 py-2 w-48 bg-white border border-gray-300 rounded-lg shadow-sm
              text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500
              focus:border-blue-500 cursor-pointer transition duration-200" >
          <option selected disabled>Categories</option>
          <option  class="p-2 hover:bg-gray-100 cursor-pointer" value="all">ALL</option>
          </select>
      </div>

      <div id="inputCategory" class="hidden  rounded-full bg-black">
        <input type="text" id="inputCategory" placeholder="Enter category..."class=" transition px-4 py-2 rounded-full transparent text-gray-800 font-semibold 
            outline-none border-2 border-gray-600 
            focus:border-blue-500 ">
      </div>

      <!-- Create Button -->
      <button id="Create" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
        <i class="fa-solid fa-plus"></i> Create
      </button>
      <!-- Add Button -->
      <button id="add" class="px-4 hidden py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
        <i class="fa-solid fa-plus"></i> Add
      </button>
    </div>
  </nav>


  <section id="mainSection" class="w-full h-full mx-auto mt-10 py-4">
      <h2 class="text-6xl text-center font-bold mb-16">Gallery</h2>
      
      <div class="w-full border-t-4  pl-4 flex flex-col">
         
        <h1 class="text-4xl font-bold  my-8 ">Cities</h1>
      <div id="imagesDiv" class="w-full px-2 gap-5 flex justify-center items-center overflow-hidden rounded-lg">
        <div class="w-1/4">
               <button id="prev" class=" bg-black p-4 h-10 flex justify-center items-center rounded-full shadow">
                 <i class="fa-solid fa-chevron-left text-teal-50"></i>
               </button>
           </div>
   
             <div id="images" class="w-full h-64 flex justify-center items-center gap-4 ">
                 <img id="galleryImg"  src="images/karachi.webp" class="w-1/3 h-80  object-cover duration-300 hover:-translate-y-2"/>
                 <img id="galleryImg"  src="images/Jhelum.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
                 <img id="galleryImg"  src="images/Kamoke.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
                 <img id="galleryImg"  src="images/Lahore.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
             </div>

           <div class="w-1/4 flex justify-end">
               <button id="next" class=" bg-black p-4 h-10 flex justify-center items-center rounded-full shadow">
                   <i class="fa-solid fa-chevron-right text-teal-50"></i>
               </button>
   
           </div>
      </div>
          
     
    </div>


      <div class=" w-full border-t-4  pl-4 my-12  flex flex-col">
         
        <h1 class="text-4xl font-bold  my-8 ">Buildings</h1>
      <div id="imagesDivBuildings" class="w-full px-2 gap-5 flex justify-center items-center overflow-hidden rounded-lg">
        <div class="w-1/4">
               <button id="prev" class=" bg-black p-4 h-10 flex justify-center items-center rounded-full shadow">
                 <i class="fa-solid fa-chevron-left text-teal-50"></i>
               </button>
           </div>
   
             <div id="images" class="w-full h-64 flex justify-center items-center gap-4 ">
                 <img id="galleryImg"  src="images/karachi.webp" class="w-1/3 h-80  object-cover duration-300 hover:-translate-y-2"/>
                 <img id="galleryImg"  src="images/Jhelum.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
                 <img id="galleryImg"  src="images/Kamoke.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
                 <img id="galleryImg"  src="images/Lahore.webp" class="w-1/3 h-80 object-fit duration-300 hover:-translate-y-2" />
             </div>

           <div class="w-1/4 flex justify-end">
               <button id="next" class=" bg-black p-4 h-10 flex justify-center items-center rounded-full shadow">
                   <i class="fa-solid fa-chevron-right text-teal-50"></i>
               </button>
   
           </div>
      </div>
          
     
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
